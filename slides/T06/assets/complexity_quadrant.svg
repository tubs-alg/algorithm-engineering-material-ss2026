   <g id="text_1">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #9aa4b2" transform="translate(21.312753 212.048656)">One-time</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #9aa4b2" transform="translate(61.720253 227.725594)">use</text>
   </g>
   <g id="text_2">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #9aa4b2" transform="translate(653.93762 212.048656)">Continuous</text>
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; fill: #9aa4b2" transform="translate(653.93762 227.725594)">use</text>
   </g>
   <g id="text_3">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9aa4b2" x="370.218937" y="412.57685" transform="rotate(-0 370.218937 412.57685)">Clear specifications</text>
   </g>
   <g id="text_4">
    <text style="font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #9aa4b2" x="370.218937" y="27.1974" transform="rotate(-0 370.218937 27.1974)">Changing requirements</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #7fbf7b" x="227.478481" y="269.990911" transform="rotate(-0 227.478481 269.990911)">A single function</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(159.724575 311.496866)">One pass, clear rules.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(147.425747 328.343546)">Structure would be noise.</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e69138" x="512.959392" y="270.057317" transform="rotate(-0 512.959392 270.057317)">Structured &amp; tested</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(436.367596 303.073526)">Schemas, a solver class,</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(461.179119 319.920206)">regression tests.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(435.346111 336.766886)">Stable, but load-bearing.</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e69138" x="227.478481" y="93.834532" transform="rotate(-0 227.478481 93.834532)">Kept malleable</text>
   </g>
   <g id="text_10">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(144.063442 126.850742)">Requirements move, but it</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(161.468715 143.697421)">is thrown away soon.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(164.698208 160.544101)">Favor easy rewrites.</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #e05a5a" x="512.959392" y="93.834532" transform="rotate(-0 512.959392 93.834532)">The full toolkit</text>
   </g>
   <g id="text_12">
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(430.087322 126.850742)">Schemas, classes, indices,</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(457.840252 143.697421)">submodels, tests.</text>
    <text style="font-size: 12.5px; font-family: 'DejaVu Sans'; fill: #e6e6e6" transform="translate(422.453533 160.544101)">Every pattern earns its keep.</text>
   </g>
  </g>
