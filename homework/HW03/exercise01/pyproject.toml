[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mutually-exclusive-knapsack"
version = "0.1.0"
description = "Teaching scaffold for a branch-and-bound solver for a knapsack problem with mutual exclusivity constraints."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Phillip Keldenich" },
  { name = "Dominik Krupke" },
]
dependencies = [
  "highspy>=1.8.1",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]

[project.scripts]
mek-generate-instance = "mutually_exclusive_knapsack.cli:generate_instance_main"
mek-baseline-solve = "mutually_exclusive_knapsack.cli:baseline_solve_instance_main"
mek-solve = "mutually_exclusive_knapsack.cli:solve_instance_main"

[tool.hatch.build.targets.wheel]
packages = ["src/mutually_exclusive_knapsack"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
